<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Витрина коллекционных подарков</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #15161f;
    --surface: #1e2029;
    --surface-2: #262838;
    --line: #33364a;
    --line-soft: #292c3c;
    --text: #f2efe6;
    --muted: #9497a6;
    --gold: #d4a843;
    --gold-soft: rgba(212,168,67,.14);
    --violet: #8b7fe8;
    --violet-soft: rgba(139,127,232,.14);
    --teal: #4fbdba;
    --teal-soft: rgba(79,189,186,.14);
    --rose: #d97a8c;
    --rose-soft: rgba(217,122,140,.14);
  }
  *{box-sizing:border-box;}
  html{-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(680px 420px at 15% -8%, #272b48 0%, transparent 62%),
      radial-gradient(620px 520px at 92% 6%, #2b2138 0%, transparent 58%),
      radial-gradient(500px 400px at 50% 110%, #1c2432 0%, transparent 60%),
      var(--bg);
    font-family:'Manrope', sans-serif;
    color:var(--text);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:44px 16px 70px;
  }

  .phone{
    width:390px;
    max-width:100%;
    background: linear-gradient(180deg, #1a1b25 0%, #131319 100%);
    border-radius:38px;
    border:1px solid #2c2e3d;
    box-shadow:
      0 50px 110px rgba(0,0,0,.6),
      0 4px 18px rgba(0,0,0,.35),
      inset 0 0 0 6px #0d0e14,
      inset 0 1px 0 rgba(255,255,255,.03);
    overflow:hidden;
    position:relative;
  }

  .notch{
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    width:120px; height:22px;
    background:#0d0e14;
    border-radius:0 0 16px 16px;
    z-index:5;
  }

  .statusbar{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 24px 2px;
    font-size:12.5px;color:var(--muted);
    font-variant-numeric: tabular-nums;
    letter-spacing:.2px;
  }

  .app-header{
    padding:10px 20px 16px;
    display:flex;
    align-items:center;
    gap:13px;
  }
  .app-header .avatar{
    width:44px;height:44px;border-radius:14px;
    background: conic-gradient(from 220deg, var(--gold), var(--rose), var(--violet), var(--gold));
    flex-shrink:0;
    position:relative;
    box-shadow: 0 6px 16px rgba(212,168,67,.25);
  }
  .app-header .avatar::after{
    content:'';
    position:absolute; inset:9px;
    background:var(--bg);
    border-radius:8px;
    clip-path: polygon(50% 8%, 92% 50%, 50% 92%, 8% 50%);
  }
  .app-header .titles{flex:1; min-width:0;}
  .app-header h1{
    font-family:'PT Serif', serif;
    font-size:19.5px;
    font-weight:700;
    margin:0;
    line-height:1.15;
    letter-spacing:-.2px;
  }
  .app-header p{
    margin:2px 0 0;
    font-size:12.5px;
    color:var(--muted);
    font-style:italic;
    font-family:'PT Serif', serif;
  }
  .balance{
    display:flex;
    align-items:center;
    gap:7px;
    background:linear-gradient(180deg, var(--surface-2), var(--surface));
    border:1px solid var(--line);
    padding:9px 13px;
    border-radius:15px;
    font-size:13.5px;
    font-weight:800;
    white-space:nowrap;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
  }
  .balance .dot{
    width:9px;height:9px;border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #f6dfa0, var(--gold));
  }

  .tabs{
    display:flex;
    gap:4px;
    padding:0 16px 16px;
    position:relative;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:10px 6px;
    font-size:13.5px;
    font-weight:700;
    color:var(--muted);
    border-radius:12px;
    cursor:pointer;
    user-select:none;
    transition:background .18s ease, color .18s ease;
    position:relative;
  }
  .tab.active{
    background:var(--surface);
    color:var(--text);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 4px 12px rgba(0,0,0,.25);
  }

  .screen{padding:0 16px 24px;}
  .panel{display:none;}
  .panel.active{display:block; animation: fadeIn .28s ease;}
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .section-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin:6px 2px 14px;
  }
  .section-row h2{
    font-family:'PT Serif', serif;
    font-size:16.5px;
    font-weight:700;
    margin:0;
    letter-spacing:-.1px;
  }
  .section-row span{
    font-size:11.5px;
    color:var(--muted);
  }

  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }

  .card{
    background:linear-gradient(165deg, var(--surface) 0%, #1a1c26 100%);
    border:1px solid var(--line);
    border-radius:19px;
    padding:13px;
    position:relative;
    overflow:hidden;
    transition:transform .16s ease, border-color .16s ease;
    opacity:0;
    animation: cardIn .45s ease forwards;
  }
  .card:active{transform:scale(.965);}
  @keyframes cardIn{ from{opacity:0; transform:translateY(10px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);} }

  .card.rarity-legendary{
    border-color: rgba(212,168,67,.4);
    box-shadow: 0 0 0 1px rgba(212,168,67,.08), 0 10px 24px rgba(212,168,67,.08);
  }

  .card .art{
    height:104px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:11px;
    position:relative;
    overflow:hidden;
  }
  .card .art::before{
    content:'';
    position:absolute; inset:0;
    background: radial-gradient(60% 60% at 50% 38%, rgba(255,255,255,.08), transparent 70%);
  }
  .card .art svg{width:64px;height:64px; position:relative; z-index:1;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.35));}

  .rarity-common .art{background:linear-gradient(160deg, var(--teal-soft), rgba(79,189,186,.04));}
  .rarity-rare .art{background:linear-gradient(160deg, var(--violet-soft), rgba(139,127,232,.04));}
  .rarity-epic .art{background:linear-gradient(160deg, var(--rose-soft), rgba(217,122,140,.04));}
  .rarity-legendary .art{background:linear-gradient(160deg, var(--gold-soft), rgba(212,168,67,.04));}

  .rarity-tag{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .rarity-tag .rdot{width:6px;height:6px;border-radius:50%;}
  .rarity-common .rdot{background:var(--teal); box-shadow:0 0 6px var(--teal);}
  .rarity-rare .rdot{background:var(--violet); box-shadow:0 0 6px var(--violet);}
  .rarity-epic .rdot{background:var(--rose); box-shadow:0 0 6px var(--rose);}
  .rarity-legendary .rdot{background:var(--gold); box-shadow:0 0 6px var(--gold);}

  .card h3{
    font-family:'PT Serif', serif;
    font-size:15px;
    margin:0 0 4px;
    line-height:1.25;
    letter-spacing:-.1px;
  }
  .card .edition{
    font-size:11.5px;
    color:var(--muted);
    margin-bottom:11px;
  }
  .edition b{color:var(--text); font-weight:700;}

  .buy-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .price{
    font-size:14.5px;
    font-weight:800;
    line-height:1.2;
  }
  .price small{
    display:block;
    font-size:10px;
    font-weight:500;
    color:var(--muted);
  }
  .buy-btn{
    border:none;
    background: linear-gradient(180deg, #fbf8ee, var(--text));
    color:#15161f;
    font-weight:800;
    font-size:12.5px;
    padding:9px 15px;
    border-radius:12px;
    cursor:pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,.25);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .buy-btn:active{transform:scale(.94);}
  .buy-btn:disabled{
    background:var(--surface-2);
    color:var(--muted);
    cursor:default;
    box-shadow:none;
  }
  .buy-btn.owned{
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    box-shadow:none;
  }

  .sold-badge{
    position:absolute;
    top:12px; right:12px;
    background:rgba(20,21,29,.88);
    backdrop-filter: blur(4px);
    border:1px solid var(--line);
    font-size:10.5px;
    padding:4px 9px;
    border-radius:8px;
    color:var(--rose);
    font-weight:700;
    z-index:2;
  }

  /* Resale + inventory rows */
  .resale-item, .inv-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:linear-gradient(165deg, var(--surface) 0%, #1a1c26 100%);
    border:1px solid var(--line);
    border-radius:17px;
    padding:11px;
    margin-bottom:10px;
    opacity:0;
    animation: cardIn .4s ease forwards;
  }
  .resale-item .art, .inv-item .art{
    width:54px;height:54px;border-radius:13px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .resale-item .art svg, .inv-item .art svg{width:32px;height:32px;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.35));}
  .resale-info, .inv-info{flex:1; min-width:0;}
  .resale-info h4, .inv-info h4{
    font-family:'PT Serif', serif;
    margin:0 0 2px;
    font-size:14px;
  }
  .resale-info .meta, .inv-info .meta{
    font-size:11.5px;
    color:var(--muted);
  }
  .resale-price{ text-align:right; }
  .resale-price .now{
    font-size:14.5px;
    font-weight:800;
    color:var(--gold);
  }
  .resale-price .was{
    font-size:11px;
    color:var(--muted);
    text-decoration:line-through;
  }

  .empty-state{
    text-align:center;
    padding:54px 20px;
    color:var(--muted);
  }
  .empty-state svg{width:56px;height:56px;margin-bottom:16px;opacity:.55;}
  .empty-state p{margin:0; font-size:13.5px; line-height:1.55;}

  .list-btn{
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--text);
    font-size:12px;
    font-weight:700;
    padding:8px 13px;
    border-radius:11px;
    cursor:pointer;
    transition:transform .12s ease;
  }
  .list-btn:active{transform:scale(.94);}

  .toast{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translate(-50%, 24px);
    background:#f2efe6;
    color:#15161f;
    padding:13px 20px;
    border-radius:14px;
    font-size:13.5px;
    font-weight:700;
    opacity:0;
    transition:opacity .25s ease, transform .25s ease;
    pointer-events:none;
    z-index:50;
    box-shadow:0 24px 48px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1; transform:translate(-50%, 0);}

  .ff-btn{
    display:block;
    width:100%;
    margin:6px 0 0;
    background:none;
    border:1px dashed var(--line);
    color:var(--muted);
    font-size:12px;
    font-weight:600;
    padding:11px 14px;
    border-radius:13px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .ff-btn:active{transform:scale(.98);}
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>
  <div class="statusbar"><span>9:41</span><span>••••</span></div>

  <div class="app-header">
    <div class="avatar"></div>
    <div class="titles">
      <h1>Витрина</h1>
      <p>лимитированные подарки в чате</p>
    </div>
    <div class="balance"><span class="dot"></span><span id="balanceValue">124 ⭐</span></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="market">Маркет</div>
    <div class="tab" data-tab="resale">Перепродажа</div>
    <div class="tab" data-tab="inventory">Мои <span id="invCount"></span></div>
  </div>

  <div class="screen">

    <!-- MARKET -->
    <div class="panel active" id="panel-market">
      <div class="section-row">
        <h2>Свежий дроп</h2>
        <span>обновление по понедельникам</span>
      </div>
      <div class="grid" id="marketGrid"></div>
      <button class="ff-btn" id="ffBtn">промотать время вперёд →</button>
    </div>

    <!-- RESALE -->
    <div class="panel" id="panel-resale">
      <div class="section-row">
        <h2>Перепродажа</h2>
        <span id="resaleCount"></span>
      </div>
      <div id="resaleList"></div>
    </div>

    <!-- INVENTORY -->
    <div class="panel" id="panel-inventory">
      <div class="section-row">
        <h2>Моя коллекция</h2>
        <span></span>
      </div>
      <div id="invList"></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---- richer illustrations (layered SVG, gradient defs per instance for unique ids) ----
let __uid = 0;
const ART = {
  sneaker: (c, key) => { const id='g'+(++__uid)+key;
    return `<svg viewBox="0 0 64 64"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".65"/></linearGradient></defs>
      <path d="M6 42c4-2 7-5 9-9 3-6 8-10 15-10 3 0 5 1 7 3 4 4 9 6 16 6 3 4 5 8 5 12H8c-2 0-3-1-3-1z" fill="url(#${id})"/>
      <path d="M10 39c4-2 7-5 9-9" stroke="#0e0f16" stroke-width="2" fill="none" opacity=".3" stroke-linecap="round"/>
      <ellipse cx="24" cy="26" rx="3" ry="3" fill="#fff" opacity=".5"/>
      <rect x="6" y="42" width="52" height="5" rx="2.5" fill="#0e0f16" opacity=".35"/></svg>`; },
  crown: (c, key) => { const id='g'+(++__uid)+key;
    return `<svg viewBox="0 0 64 64"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".3" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".7"/></linearGradient></defs>
      <path d="M10 44l4-22 10 11 8-17 8 17 10-11 4 22z" fill="url(#${id})"/>
      <rect x="8" y="44" width="48" height="7" rx="2.5" fill="${c}"/>
      <circle cx="32" cy="16" r="3.4" fill="#fff" opacity=".7"/>
      <circle cx="14" cy="24" r="2.4" fill="#fff" opacity=".5"/>
      <circle cx="50" cy="24" r="2.4" fill="#fff" opacity=".5"/></svg>`; },
  gem: (c, key) => { const id='g'+(++__uid)+key;
    return `<svg viewBox="0 0 64 64"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".4" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".75"/></linearGradient></defs>
      <polygon points="32,7 51,23 40,57 24,57 13,23" fill="url(#${id})"/>
      <polygon points="32,7 51,23 32,29 13,23" fill="#fff" opacity=".3"/>
      <polygon points="32,29 40,57 24,57" fill="#000" opacity=".12"/>
      <line x1="32" y1="7" x2="32" y2="29" stroke="#fff" stroke-opacity=".25" stroke-width="1.2"/></svg>`; },
  mask: (c, key) => { const id='g'+(++__uid)+key;
    return `<svg viewBox="0 0 64 64"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".7"/></linearGradient></defs>
      <path d="M8 30c0-14 11-20 24-20s24 6 24 20c0 12-9 20-24 20S8 42 8 30z" fill="url(#${id})"/>
      <path d="M14 22c6-4 12 2 18 0" stroke="#0e0f16" stroke-width="2" fill="none" opacity=".3" stroke-linecap="round"/>
      <ellipse cx="23" cy="30" rx="4.5" ry="5.5" fill="#0e0f16" opacity=".55"/>
      <ellipse cx="41" cy="30" rx="4.5" ry="5.5" fill="#0e0f16" opacity=".55"/>
      <path d="M28 42c2 2 6 2 8 0" stroke="#0e0f16" stroke-width="2" fill="none" opacity=".4" stroke-linecap="round"/></svg>`; },
  bolt: (c, key) => { const id='g'+(++__uid)+key;
    return `<svg viewBox="0 0 64 64"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="${c}"/></linearGradient></defs>
      <polygon points="38,3 15,36 29,36 24,61 51,27 35,27" fill="${c}" opacity=".35"/>
      <polygon points="36,4 13,34 27,34 22,58 49,25 33,25" fill="url(#${id})"/></svg>`; },
  medal: (c, key) => { const id='g'+(++__uid)+key;
    return `<svg viewBox="0 0 64 64"><defs><radialGradient id="${id}" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="${c}"/></radialGradient></defs>
      <path d="M20 8l6 16h-13z" fill="${c}" opacity=".55"/>
      <path d="M44 8l-6 16h13z" fill="${c}" opacity=".55"/>
      <circle cx="32" cy="40" r="19" fill="url(#${id})"/>
      <circle cx="32" cy="40" r="19" fill="none" stroke="#0e0f16" stroke-opacity=".18" stroke-width="2"/>
      <path d="M32 31l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z" fill="#fff" opacity=".55"/></svg>`; }
};

const COLORS = { common:'#4fbdba', rare:'#8b7fe8', epic:'#d97a8c', legendary:'#d4a843' };
const LABELS = { common:'обычный', rare:'редкий', epic:'эпический', legendary:'легендарный' };

let items = [
  { id:'sneak', name:'Кроссы «Полночь»', rarity:'common', art:'sneaker', total:120, left:63, price:9 },
  { id:'crown', name:'Корона основателя', rarity:'legendary', art:'crown', total:10, left:2, price:75 },
  { id:'gem',   name:'Осколок звезды', rarity:'rare', art:'gem', total:80, left:31, price:19 },
  { id:'mask',  name:'Маска карнавала', rarity:'epic', art:'mask', total:40, left:6, price:38 },
  { id:'bolt',  name:'Разряд', rarity:'rare', art:'bolt', total:70, left:0, price:22 },
  { id:'medal', name:'Знак старожила', rarity:'epic', art:'medal', total:30, left:1, price:45 }
];

let inventory = [];
let resale = [
  { name:'Разряд', art:'bolt', rarity:'rare', mint:22, now:96 },
  { name:'Знак старожила', art:'medal', rarity:'epic', mint:45, now:310 }
];

const marketGrid = document.getElementById('marketGrid');
const resaleList = document.getElementById('resaleList');
const invList = document.getElementById('invList');
const toast = document.getElementById('toast');
const balanceEl = document.getElementById('balanceValue');
let balance = 124;

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toast.classList.remove('show'), 2200);
}

function renderMarket(){
  marketGrid.innerHTML = items.map((it, i) => {
    const soldOut = it.left <= 0;
    const owned = inventory.some(x => x.itemId === it.id);
    return `
    <div class="card rarity-${it.rarity}" style="animation-delay:${i*45}ms">
      ${soldOut ? '<div class="sold-badge">раскуплено</div>' : ''}
      <div class="art">${ART[it.art](COLORS[it.rarity], it.id)}</div>
      <div class="rarity-tag"><span class="rdot"></span>${LABELS[it.rarity]}</div>
      <h3>${it.name}</h3>
      <div class="edition">осталось <b>${it.left}</b> из ${it.total}</div>
      <div class="buy-row">
        <div class="price">${it.price} ⭐<small>цена дропа</small></div>
        <button class="buy-btn ${owned?'owned':''}" ${soldOut||owned?'disabled':''} onclick="buy('${it.id}')">
          ${owned ? 'у вас есть' : soldOut ? 'нет мест' : 'купить'}
        </button>
      </div>
    </div>`;
  }).join('');
}

function buy(id){
  const it = items.find(i => i.id === id);
  if (!it || it.left <= 0) return;
  if (balance < it.price){ showToast('Не хватает ⭐ на балансе'); return; }
  balance -= it.price;
  it.left -= 1;
  inventory.push({ itemId: it.id, name: it.name, rarity: it.rarity, art: it.art, boughtFor: it.price });
  balanceEl.textContent = balance + ' ⭐';
  document.getElementById('invCount').textContent = '(' + inventory.length + ')';
  showToast(`«${it.name}» теперь ваш`);
  renderMarket();
  renderInventory();
}

function renderInventory(){
  if (inventory.length === 0){
    invList.innerHTML = `
      <div class="empty-state">
        ${ART.gem('#4a4d5c','empty')}
        <p>Пока пусто. Купите что-нибудь на вкладке «Маркет» — сюда попадёт всё, чем вы владеете.</p>
      </div>`;
    return;
  }
  invList.innerHTML = inventory.map((x, idx) => `
    <div class="inv-item" style="animation-delay:${idx*40}ms">
      <div class="art" style="background:${COLORS[x.rarity]}22">${ART[x.art](COLORS[x.rarity], x.itemId+idx)}</div>
      <div class="inv-info">
        <h4>${x.name}</h4>
        <div class="meta">куплено за ${x.boughtFor} ⭐ · ${LABELS[x.rarity]}</div>
      </div>
      <button class="list-btn" onclick="listForSale(${idx})">выставить</button>
    </div>
  `).join('');
}

function listForSale(idx){
  const x = inventory[idx];
  showToast(`«${x.name}» выставлен на перепродажу`);
  resale.unshift({ name:x.name, art:x.art, rarity:x.rarity, mint:x.boughtFor, now: Math.round(x.boughtFor * (2 + Math.random()*3)) });
  inventory.splice(idx,1);
  document.getElementById('invCount').textContent = '(' + inventory.length + ')';
  renderInventory();
  renderResale();
}

function renderResale(){
  document.getElementById('resaleCount').textContent = resale.length + ' предложений';
  resaleList.innerHTML = resale.map((r, idx) => `
    <div class="resale-item" style="animation-delay:${idx*40}ms">
      <div class="art" style="background:${COLORS[r.rarity]}22">${ART[r.art](COLORS[r.rarity], 'r'+idx)}</div>
      <div class="resale-info">
        <h4>${r.name}</h4>
        <div class="meta">не в дропе · ${LABELS[r.rarity]}</div>
      </div>
      <div class="resale-price">
        <div class="now">${r.now} ⭐</div>
        <div class="was">было ${r.mint} ⭐</div>
      </div>
    </div>
  `).join('');
}

document.getElementById('ffBtn').addEventListener('click', () => {
  const candidates = items.filter(i => i.left > 0 && i.left <= 5);
  if (candidates.length){
    const it = candidates[Math.floor(Math.random()*candidates.length)];
    it.left = 0;
    resale.unshift({ name: it.name, art: it.art, rarity: it.rarity, mint: it.price, now: Math.round(it.price * (2.5 + Math.random()*4)) });
    showToast(`«${it.name}» раскуплен — появился на перепродаже`);
  } else {
    resale.forEach(r => r.now = Math.round(r.now * (1.05 + Math.random()*0.2)));
    showToast('Цены на перепродаже подросли');
  }
  renderMarket();
  renderResale();
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  });
});

renderMarket();
renderResale();
renderInventory();
</script>

</body>
</html>
